
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and Test with Java 21

    env:
      DB_TYPE: sqlite
      SQLITE_DB_PATH: /tmp/sorrentodb.sqlite

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Java 21 and Maven cache
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Setup SQLite database
      - name: Setup SQLite database
        run: |
          echo "Setting up SQLite database..."
          sudo apt-get update
          sudo apt-get install -y sqlite3

          echo "Creating database..."
          sqlite3 "$SQLITE_DB_PATH" < schema.sql

          echo "Verifying database..."
          sqlite3 "$SQLITE_DB_PATH" "SELECT COUNT(*) FROM LIDO;"

          echo "SQLite database initialized successfully"

      # 4. Run automated tests
      - name: Run tests
        run: mvn clean test

      # 5. Generate JaCoCo coverage report
      - name: Generate JaCoCo report
        if: always()
        run: mvn jacoco:report

      # 6. Publish test results
      - name: Generate test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Maven Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      # 7. Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # 8. Upload test results to Codecov
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./target/surefire-reports/TEST-*.xml
          fail_ci_if_error: false

      # 9. Run PiTest mutation testing
      - name: Run PiTest mutation testing
        run: mvn org.pitest:pitest-maven:mutationCoverage
        continue-on-error: true

      # 10. Build application
      - name: Build application
        run: mvn package -DskipTests

      # 11. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorrentomarina-${{ github.sha }}
          path: target/SorrentoMarina-1.0.war
          retention-days: 30

      # 12. Prepare reports for GitHub Pages
      - name: Prepare reports for GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p github-pages/PiTest
          mkdir -p github-pages/Jacoco

          if [ -d "target/pit-reports" ]; then
            cp -r target/pit-reports/* github-pages/PiTest/ || true
          fi

          if [ -d "target/site/jacoco" ]; then
            cp -r target/site/jacoco/* github-pages/Jacoco/ || true
          fi

      # 13. Upload uniquely named Pages artifact
      - name: Upload reports artifact
        uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./github-pages

      # 14. Deploy reports to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: success() && github.ref == 'refs/heads/main'
        id: deployment
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
